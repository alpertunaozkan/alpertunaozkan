# Avukat Alper Tuna Özkan — nginx yapılandırması (örnek).
#
# Uygulama aynı sunucuda 127.0.0.1:3000 adresinde çalışır (deploy/systemd/alpertunaozkan.service).
# Kurulum: sudo cp deploy/nginx/alpertunaozkan.conf /etc/nginx/sites-available/alpertunaozkan
#          sudo ln -s /etc/nginx/sites-available/alpertunaozkan /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Sertifika yolları Let's Encrypt (certbot) varsayımıyla yazılmıştır:
#   sudo certbot certonly --nginx -d alpertunaozkan.com -d www.alpertunaozkan.com -d panel.alpertunaozkan.com
# Eski projenin aynı alan adları için tanımladığı server blokları devre dışı bırakılmalıdır.

# HTTP → HTTPS (Let's Encrypt doğrulama istekleri hariç).
server {
    listen 80;
    listen [::]:80;
    server_name alpertunaozkan.com www.alpertunaozkan.com panel.alpertunaozkan.com;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://www.alpertunaozkan.com$request_uri;
    }
}

# Çıplak alan adı → www (sitenin adresi: NEXT_PUBLIC_SITE_URL).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name alpertunaozkan.com;

    ssl_certificate     /etc/letsencrypt/live/alpertunaozkan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpertunaozkan.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.alpertunaozkan.com$request_uri;
}

# Eski yönetim paneli adresi → yeni panel.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.alpertunaozkan.com;

    ssl_certificate     /etc/letsencrypt/live/alpertunaozkan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpertunaozkan.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.alpertunaozkan.com/admin;
}

# Site ve yönetim paneli.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.alpertunaozkan.com;

    ssl_certificate     /etc/letsencrypt/live/alpertunaozkan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alpertunaozkan.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Giriş ve iletişim formu deneme sınırları istemcinin IP'sini bu başlıklardan okur.
        # İstemcinin gönderdiği değerler üzerine yazılır (IP sahteciliğine karşı).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
